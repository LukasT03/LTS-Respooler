; LTS Respooler Control Board V4 (ESP32-S3) build.
; Sketch source: ../Firmware/(.txt) Control Board Code (copied by copy_sketch.py).
; Settings mirror the official ControlBoard_V4 image: ESP-IDF 5.5.1 (Arduino core 3.3.x),
; 4MB DIO @ 80MHz flash, min_spiffs partition layout (nvs@0x9000, 2x 1.9MB OTA apps).

[env:controlboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = min_spiffs.csv

extra_scripts = pre:copy_sketch.py
build_flags = -include $PROJECT_INCLUDE_DIR/prototypes.h

lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    h2zero/NimBLE-Arduino@^2.3.0
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.3

monitor_speed = 115200
